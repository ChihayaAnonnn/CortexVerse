# CortexVerse 基础设施服务

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: cortexverse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cortexverse
      POSTGRES_PASSWORD: cortexverse
      POSTGRES_DB: cortexverse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexverse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
